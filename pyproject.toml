[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotly"
version = "7.0.0"
description = "Spotly · Autonomous Broadcast Intelligence"
requires-python = ">=3.10"

[project.scripts]
spotly = "spotly.cli:main"

[tool.setuptools.packages.find]
include = ["spotly*"]
